<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nada's Academic Tracker | تتبع الدراسة والمصاريف</title>
  <style>
    :root {
      --primary: #2c3e50;
      --accent: #3498db;
      --danger: #e74c3c;
      --success: #2ecc71;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--primary);
      color: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .lang-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    h2 {
      margin-top: 0;
      color: var(--primary);
      border-bottom: 2px solid var(--bg);
      padding-bottom: 10px;
    }

    .form-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    input, button, select {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }

    input { flex: 1; min-width: 120px; }

    button.add-btn {
      background: var(--success);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      text-align: inherit;
    }

    th { background: #fafafa; }

    .progress-bar {
      background: #eee;
      border-radius: 10px;
      height: 12px;
      overflow: hidden;
      width: 100px;
      display: inline-block;
    }

    .progress-fill {
      background: var(--accent);
      height: 100%;
    }

    .danger-text { color: var(--danger); font-weight: bold; }
    .delete-btn { background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1 id="title">كلية الطب - المرحلة الثالثة</h1>
      <p id="subtitle">جامعة أشور | نظام تتبع المحاضرات والغيابات والمصاريف</p>
    </div>
    <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">English</button>
  </header>

  <!-- المواد والمحاضرات -->
  <div class="card">
    <h2 id="subjectsHeading">المواد والمحاضرات</h2>
    <div class="form-group">
      <input type="text" id="subjectName" placeholder="اسم المادة">
      <input type="number" id="totalLecs" placeholder="إجمالي المحاضرات">
      <input type="number" id="completedLecs" placeholder="المكتملة">
      <input type="number" id="absences" placeholder="عدد الغيابات">
      <input type="number" id="warningLimit" placeholder="حد الإنذار (غيابات)">
      <button class="add-btn" onclick="addSubject()" id="addSubjectBtn">إضافة مادة</button>
    </div>

    <table>
      <thead>
        <tr>
          <th id="thSubject">المادة</th>
          <th id="thProgress">الإنجاز</th>
          <th id="thAbsence">الغيابات</th>
          <th id="thWarning">حالة الإنذار</th>
          <th id="thAction">إجراء</th>
        </tr>
      </thead>
      <tbody id="subjectsTable"></tbody>
    </table>
  </div>

  <!-- المصاريف -->
  <div class="card">
    <h2 id="expensesHeading">سجل المصاريف</h2>
    <div class="form-group">
      <input type="text" id="expDesc" placeholder="وصف المصروف (مثلاً: ملازم، نقل...)">
      <input type="number" id="expAmount" placeholder="المبلغ">
      <button class="add-btn" onclick="addExpense()" id="addExpBtn">إضافة مصروف</button>
    </div>

    <table>
      <thead>
        <tr>
          <th id="thExpDesc">الوصف</th>
          <th id="thExpAmount">المبلغ</th>
          <th id="thExpAction">إجراء</th>
        </tr>
      </thead>
      <tbody id="expensesTable"></tbody>
    </table>
    <h3><span id="totalExpText">الإجمالي:</span> <span id="totalExpense">0</span></h3>
  </div>
</div>

<script>
  let currentLang = 'ar';

  const translations = {
    ar: {
      title: "كلية الطب - المرحلة الثالثة",
      subtitle: "جامعة أشور | نظام تتبع المحاضرات والغيابات والمصاريف",
      langBtn: "English",
      subjectsHeading: "المواد والمحاضرات",
      subjectName: "اسم المادة",
      totalLecs: "إجمالي المحاضرات",
      completedLecs: "المكتملة",
      absences: "عدد الغيابات",
      warningLimit: "حد الإنذار (غيابات)",
      addSubjectBtn: "إضافة مادة",
      thSubject: "المادة",
      thProgress: "الإنجاز",
      thAbsence: "الغيابات",
      thWarning: "حالة الإنذار",
      thAction: "إجراء",
      expensesHeading: "سجل المصاريف",
      expDesc: "وصف المصروف (مثلاً: ملازم، نقل...)",
      expAmount: "المبلغ",
      addExpBtn: "إضافة مصروف",
      thExpDesc: "الوصف",
      thExpAmount: "المبلغ",
      thExpAction: "إجراء",
      totalExpText: "الإجمالي:",
      safe: "آمن",
      warning: "حذر/إنذار",
      delete: "حذف"
    },
    en: {
      title: "Faculty of Medicine - 3rd Stage",
      subtitle: "Ashur University | Lectures, Absences & Expense Tracker",
      langBtn: "عربي",
      subjectsHeading: "Subjects & Lectures",
      subjectName: "Subject Name",
      totalLecs: "Total Lectures",
      completedLecs: "Completed",
      absences: "Absences",
      warningLimit: "Warning Limit",
      addSubjectBtn: "Add Subject",
      thSubject: "Subject",
      thProgress: "Progress",
      thAbsence: "Absences",
      thWarning: "Warning Status",
      thAction: "Action",
      expensesHeading: "Expense Log",
      expDesc: "Description (e.g. Books, Transport)",
      expAmount: "Amount",
      addExpBtn: "Add Expense",
      thExpDesc: "Description",
      thExpAmount: "Amount",
      thExpAction: "Action",
      totalExpText: "Total:",
      safe: "Safe",
      warning: "Warning Risk",
      delete: "Delete"
    }
  };

  let subjects = JSON.parse(localStorage.getItem('subjects')) || [];
  let expenses = JSON.parse(localStorage.getItem('expenses')) || [];

  function saveAndRender() {
    localStorage.setItem('subjects', JSON.stringify(subjects));
    localStorage.setItem('expenses', JSON.stringify(expenses));
    renderSubjects();
    renderExpenses();
  }

  function toggleLanguage() {
    currentLang = currentLang === 'ar' ? 'en' : 'ar';
    document.getElementById('htmlTag').dir = currentLang === 'ar' ? 'rtl' : 'ltr';
    document.getElementById('htmlTag').lang = currentLang;

    const t = translations[currentLang];
    for (let key in t) {
      let el = document.getElementById(key);
      if (el) {
        if (el.tagName === 'INPUT') el.placeholder = t[key];
        else el.innerText = t[key];
      }
    }
    renderSubjects();
    renderExpenses();
  }

  function addSubject() {
    const name = document.getElementById('subjectName').value;
    const total = parseInt(document.getElementById('totalLecs').value) || 0;
    const completed = parseInt(document.getElementById('completedLecs').value) || 0;
    const abs = parseInt(document.getElementById('absences').value) || 0;
    const limit = parseInt(document.getElementById('warningLimit').value) || 0;

    if (!name) return;

    subjects.push({ name, total, completed, abs, limit });
    saveAndRender();
  }

  function renderSubjects() {
    const tbody = document.getElementById('subjectsTable');
    tbody.innerHTML = '';
    const t = translations[currentLang];

    subjects.forEach((sub, idx) => {
      const pct = sub.total > 0 ? Math.round((sub.completed / sub.total) * 100) : 0;
      const isWarn = sub.limit > 0 && sub.abs >= sub.limit;

      tbody.innerHTML += `
        <tr>
          <td><b>${sub.name}</b></td>
          <td>
            ${pct}%
            <div class="progress-bar"><div class="progress-fill" style="width: ${pct}%"></div></div>
            <br><small>(${sub.completed}/${sub.total})</small>
          </td>
          <td>${sub.abs}</td>
          <td class="${isWarn ? 'danger-text' : ''}">${isWarn ? t.warning : t.safe}</td>
          <td><button class="delete-btn" onclick="deleteSubject(${idx})">${t.delete
